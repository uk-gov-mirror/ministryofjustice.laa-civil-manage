# Production environment values for laa-civil-manage.
# Uses the laa-generic-helm-chart contract.
# See: https://github.com/ministryofjustice/laa-generic-helm-chart

environment: prod
appName: ""
nameOverride: "laa-civil-manage"
namespace: laa-civil-manage-production
# Increase to 3+ when ready for live users
replicaCount: 2
minReplicaCount: 1
serviceAccountName: cd-serviceaccount
createServiceAccount: false

image:
  registry: ""
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

service:
  port: 8080

ingress:
  green:
    enabled: true
    className: modsec
    hostname: laa-civil-manage.cloud-platform.service.justice.gov.uk
    path: /
    pathType: Prefix
    annotations:
      external-dns.alpha.kubernetes.io/set-identifier: "laa-civil-manage-laa-civil-manage-production-green"
      external-dns.alpha.kubernetes.io/aws-weight: "100"
      nginx.ingress.kubernetes.io/custom-http-errors: "418"
  blue:
    enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 60

readinessProbe:
  httpGet:
    path: /health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 60

autoscaling:
  enabled: false

# ---------------------------------------------------------------------------
# Container environment — all env vars and k8s secrets for the pod
# ---------------------------------------------------------------------------
containerEnvironment:
  enabled: true
  variables:
    PORT: "8080"
    NODE_ENV: "production"
    SESSION_NAME: "sessionId"
    SKIP_AUTH: "false"
    RATE_LIMIT_MAX: "2500"
    RATE_WINDOW_MS: "900000"
    SERVICE_NAME: "laa-civil-manage"
    SERVICE_PHASE: "Beta"
    DEPARTMENT_NAME: "Legal aid agency"
    MANAGE_API_SCOPE: "" # TODO: populate with production scope
    AUTH_CLIENT_ID: "" # TODO: populate with production scope
    AUTH_DIRECTORY_URL: "" # TODO: populate with production scope
    AUTH_REDIRECT_URL: "" # TODO: populate with production redirect URL
    AUTH_LOGOUT_REDIRECT_URL: "" # TODO: populate with production logout URL
    BACKEND_URL: "" # TODO: populate with production backend URL
  secrets:
    - name: SESSION_SECRET
      secretName: session-secret-production
      key: SESSION_SECRET
    - name: AUTH_CLIENT_SECRET
      secretName: auth-client-secret-production
      key: AUTH_CLIENT_SECRET
    - name: SESSION_REDIS_URL
      secretName: elasticache-laa-civil-manage-production
      key: url

volumes: []
volumeMounts: []
nodeSelector: {}

tolerations: []

affinity: {}
