# Dev environment values for laa-civil-manage.
# Uses the laa-generic-helm-chart contract.
# See: https://github.com/ministryofjustice/laa-generic-helm-chart

environment: dev
appName: ""
nameOverride: "laa-civil-manage"
namespace: laa-civil-manage-dev
replicaCount: 1
serviceAccountName: cd-serviceaccount
createServiceAccount: false

image:
  registry: ""
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

service:
  port: 8080

ingress:
  green:
    enabled: true
    className: modsec-non-prod
    hostname: laa-civil-manage-dev.cloud-platform.service.justice.gov.uk
    path: /
    pathType: Prefix
    annotations:
      external-dns.alpha.kubernetes.io/set-identifier: "laa-civil-manage-laa-civil-manage-dev-green"
      external-dns.alpha.kubernetes.io/aws-weight: "100"
      nginx.ingress.kubernetes.io/custom-http-errors: "418"
      nginx.ingress.kubernetes.io/enable-modsecurity: "true"
      nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
      nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
      nginx.ingress.kubernetes.io/modsecurity-snippet: |
        SecRuleEngine On
        SecDefaultAction "phase:2,pass,log,tag:github_team=laa-civil-manage-an-application"
        SecRule REMOTE_ADDR "!@ipMatch 35.176.93.186/32,128.77.75.64/26" "id:1001,deny,status:403,tag:github_team=laa-civil-manage-an-application"
      # VPN IP ranges from: https://github.com/ministryofjustice/moj-ip-addresses/blob/main/moj-cidr-addresses.yml#L267
  blue:
    enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 60

readinessProbe:
  httpGet:
    path: /health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 60

autoscaling:
  enabled: false

# ---------------------------------------------------------------------------
# Container environment — all env vars and k8s secrets for the pod
# ---------------------------------------------------------------------------
containerEnvironment:
  enabled: true
  variables:
    PORT: "8080"
    NODE_ENV: "production"
    SESSION_NAME: "sessionId"
    SKIP_AUTH: "false"
    RATE_LIMIT_MAX: "2500"
    RATE_WINDOW_MS: "900000"
    SERVICE_NAME: "laa-civil-manage"
    SERVICE_PHASE: "Beta"
    DEPARTMENT_NAME: "Legal aid agency"
    MANAGE_API_SCOPE: "api://devlexternal.onmicrosoft.com/024c9bb4-b5fd-434b-abff-1d7d7c8776f4/access_as_user"
    AUTH_CLIENT_ID: "770fe17c-7942-4c3d-8608-4f7f367d95ce"
    AUTH_DIRECTORY_URL: "https://login.microsoftonline.com/8352c342-da15-413a-8b5b-d89545766f0c"
    AUTH_REDIRECT_URL: "https://laa-civil-manage-dev.cloud-platform.service.justice.gov.uk/auth/redirect"
    AUTH_LOGOUT_REDIRECT_URL: "https://laa-civil-manage-dev.cloud-platform.service.justice.gov.uk/auth/login"
    BACKEND_URL: "http://laa-civil-manage-api.laa-civil-manage-api-dev.svc.cluster.local:8080"
  secrets:
    - name: SESSION_SECRET
      secretName: session-secret-dev
      key: SESSION_SECRET
    - name: AUTH_CLIENT_SECRET
      secretName: auth-client-secret-dev
      key: AUTH_CLIENT_SECRET
    - name: SESSION_REDIS_URL
      secretName: elasticache-laa-civil-manage-dev
      key: url

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
